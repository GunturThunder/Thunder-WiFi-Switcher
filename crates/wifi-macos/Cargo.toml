[package]
name = "wifi-macos"
description = "macOS Wi-Fi backend for Thunder WiFi Switcher (CoreWLAN + Keychain)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
thunder-core = { path = "../thunder-core" }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-core-foundation = "0.3.2"
objc2-core-location = "0.3.2"
objc2-core-wlan = "0.3.2"
objc2-foundation = "0.3.2"
objc2-system-configuration = "0.3.2"
security-framework = "3.7.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
rpassword = "7"

[lints]
workspace = true
