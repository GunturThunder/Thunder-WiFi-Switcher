name: Bug report
description: Something in the app doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!
        If the problem is about *when* the app switches networks (or doesn't), the **Network report** form asks for the details we need to fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Click …
        3. …
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 26.1, Windows 11 24H2
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings → About.
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        macOS: `~/Library/Logs/ThunderWiFi/` · Windows: `%LOCALAPPDATA%\ThunderWiFi\logs\`
        Logs contain network names and signal values only, never passwords. Remove anything you'd rather not share.
      render: text
    validations:
      required: false
