version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      svelte-vite:
        patterns: ["svelte*", "@sveltejs/*", "vite"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
