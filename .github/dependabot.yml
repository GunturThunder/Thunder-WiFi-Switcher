version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      svelte-vite:
        patterns: ["svelte*", "@sveltejs/*", "vite"]
    ignore:
      # svelte-check only supports TypeScript ^5 || ^6 (checked with 4.7.8).
      # Remove this once a svelte-check release supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
