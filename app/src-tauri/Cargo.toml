[package]
name = "thunder-wifi-switcher"
description = "Keeps you on the Wi-Fi network with the best internet, not just the strongest signal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# `_lib` suffix avoids a file-name clash between the lib and bin targets on Windows.
name = "thunder_wifi_switcher_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
thunder-core = { path = "../../crates/thunder-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
wifi-macos = { path = "../../crates/wifi-macos" }

[target.'cfg(windows)'.dependencies]
wifi-windows = { path = "../../crates/wifi-windows" }

[lints]
workspace = true
