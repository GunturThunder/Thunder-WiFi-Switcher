[package]
name = "thunder-wifi-switcher"
description = "Keeps you on the Wi-Fi network with the best internet, not just the strongest signal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# `_lib` suffix avoids a file-name clash between the lib and bin targets on Windows.
name = "thunder_wifi_switcher_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# Added once they're wired in (Phases 1–3):
#   thunder-core.workspace = true
#   [target.'cfg(target_os = "macos")'.dependencies] wifi-macos.workspace = true
#   [target.'cfg(windows)'.dependencies] wifi-windows.workspace = true

[lints]
workspace = true
