<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3DB8"/>
      <stop offset="0.55" stop-color="#3D6BFF"/>
      <stop offset="1" stop-color="#22B8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#FFD23F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD23F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1460" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS plate: 824x824 on the Apple 1024 grid -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- Wi-Fi arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round" filter="url(#soft)">
    <path d="M236 414 A390 390 0 0 1 788 414"/>
    <path d="M321 499 A270 270 0 0 1 703 499"/>
    <path d="M406 584 A150 150 0 0 1 618 584"/>
  </g>

  <!-- Lightning bolt (replaces the Wi-Fi dot) -->
  <g transform="translate(512 722) scale(1.15) translate(-537 -720)" filter="url(#soft)">
    <path d="M530 600 L594 600 L550 688 L604 688 L494 840 L522 724 L470 724 Z"
          fill="url(#bolt)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
