[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/GunturThunder/Thunder-WiFi-Switcher"
authors = ["Thunder WiFi Switcher contributors"]
publish = false

# Shared dependency versions go in [workspace.dependencies] once crates depend on
# each other (Phase 1–3), e.g. `thunder-core = { path = "crates/thunder-core" }`.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast release builds (PRD targets: under 1% CPU and 50 MB memory).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
